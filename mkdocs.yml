site_name: rhughes1
site_url: https://rhughes1.github.io
site_description: Platform engineering, cloud architecture, and DevOps consulting by rhughes1.
site_author: rhughes1
repo_url: https://github.com/rhughes1/rhughes1.github.io
repo_name: rhughes1/rhughes1.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

plugins:
  - search
  - blog:
      blog_dir: blog
      post_date_format: long
      post_url_format: "{date}/{slug}"
      post_excerpt: required
      post_excerpt_separator: <!-- more -->
      categories: true
      archive: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

extra:
  social:
    - icon: simple/jira
      link: https://rhughes1.atlassian.net/
      name: Jira Cloud
    - icon: simple/terraform
      link: https://app.terraform.io/app/rhughes1/
      name: HCP Terraform
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/ryan-hughes-csm-0601453b/
    - icon: fontawesome/brands/github
      link: https://github.com/rhughes1

extra_css:
  - overrides/os-selector.css
  - overrides/homepage.css
  - overrides/blog.css

extra_javascript:
  - overrides/os-selector.js

